_format_version: "3.0"

# Global CORS: browser UI (e.g. localhost:3000 / :5173) calls Kong on :8000.
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
      credentials: true
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Requested-With
      max_age: 3600
  - name: rate-limiting
    config:
      policy: local
      limit_by: ip
      second: 30
      minute: 600
      fault_tolerant: true
      hide_client_headers: false

services:
  - name: games-service
    url: http://games:4001
    routes:
      - name: games-routes
        paths:
          - /games
        strip_path: true

  - name: wallets-service
    url: http://wallets:4002
    routes:
      - name: wallets-routes
        paths:
          - /wallets
        strip_path: true
